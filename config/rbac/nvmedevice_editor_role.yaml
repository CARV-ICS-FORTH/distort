# This rule is not used by the project distort itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the storage.distort.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: distort
    app.kubernetes.io/managed-by: kustomize
  name: nvmedevice-editor-role
rules:
- apiGroups:
  - storage.distort.io
  resources:
  - nvmedevices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - storage.distort.io
  resources:
  - nvmedevices/status
  verbs:
  - get
