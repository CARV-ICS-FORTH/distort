image:
  # A fully qualified repository is required because DISTORT does not yet
  # publish a default image. Example: ghcr.io/example/distort
  repository: ""
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion (0.5.0).
  tag: ""
  # Optional immutable sha256 digest. When set, digest takes precedence over tag.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

manager:
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

agent:
  spdk:
    # Leave both empty to use SPDK defaults. Set both when a deployment needs
    # explicit iobuf sizing for its workload and hugepage budget.
    iobufSmallPoolCount: ""
    iobufLargePoolCount: ""
    # Leave empty to use SPDK's default RDMA shared receive queue depth. A
    # smaller positive value reduces DMA memory at the cost of queue capacity.
    maxSrqDepth: ""
    # Set when hugepages are provisioned by the host administrator. This keeps
    # SPDK setup.sh from replacing that reservation with its 2 GiB default.
    skipHugepageSetup: false
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
      hugepages-2Mi: 1Gi
    requests:
      cpu: 10m
      memory: 1Gi
      hugepages-2Mi: 1Gi

csi:
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

serviceAccount:
  # Specifies whether component service accounts should be created.
  create: true
  # Annotations added to every component service account.
  annotations: {}
  # Optional component-specific names. Empty values use <release>-distort-<component>
  # when create is true. All four names are required and must be distinct when false.
  names:
    manager: ""
    agent: ""
    csiController: ""
    csiNode: ""

rbac:
  # Specifies whether RBAC resources should be created
  create: true

nodeSelector: {}

tolerations: []

affinity: {}
