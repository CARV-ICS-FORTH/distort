image:
  repository: distort
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

manager:
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

agent:
  spdk:
    # Leave both empty to use SPDK defaults. Set both when a deployment needs
    # explicit iobuf sizing for its workload and hugepage budget.
    iobufSmallPoolCount: ""
    iobufLargePoolCount: ""
    # Leave empty to use SPDK's default RDMA shared receive queue depth. A
    # smaller positive value reduces DMA memory at the cost of queue capacity.
    maxSrqDepth: ""
    # Set when hugepages are provisioned by the host administrator. This keeps
    # SPDK setup.sh from replacing that reservation with its 2 GiB default.
    skipHugepageSetup: false
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
      hugepages-2Mi: 1Gi
    requests:
      cpu: 10m
      memory: 1Gi
      hugepages-2Mi: 1Gi

csi:
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "distort"

rbac:
  # Specifies whether RBAC resources should be created
  create: true

nodeSelector: {}

tolerations: []

affinity: {}
