image:
  # The public BXI image. The digest pins this chart release to the exact image
  # published under the readable bxi-dev tag.
  repository: docker.io/kampia99/distort
  pullPolicy: IfNotPresent
  tag: bxi-dev
  # Digest takes precedence over tag. Clear it explicitly when overriding tag.
  digest: sha256:f017873a3fa4c0c5559814ca11753eae02a7d483ca845e39c9ad9bd545fe1bf3

imagePullSecrets: []
# Keep Kubernetes object names stable even though this distribution's chart
# package is named distort-bxi.
nameOverride: "distort"
fullnameOverride: ""

manager:
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

agent:
  spdk:
    # Leave both empty to use SPDK defaults. Set both when a deployment needs
    # explicit iobuf sizing for its workload and hugepage budget.
    iobufSmallPoolCount: ""
    iobufLargePoolCount: ""
    # Leave empty to use SPDK's default RDMA shared receive queue depth. A
    # smaller positive value reduces DMA memory at the cost of queue capacity.
    maxSrqDepth: ""
    # Set when hugepages are provisioned by the host administrator. This keeps
    # SPDK setup.sh from replacing that reservation with its 2 GiB default.
    skipHugepageSetup: false
  resources:
    limits:
      memory: 1Gi
      hugepages-2Mi: 1Gi
    requests:
      # Reserve capacity for SPDK polling reactors and agent control-plane work.
      # Do not apply a CPU limit: CFS quota throttling severely reduces SPDK IOPS.
      cpu: "2"
      memory: 1Gi
      hugepages-2Mi: 1Gi
  # Schedule the privileged storage agent only on NVMe/RDMA provider nodes.
  nodeSelector: {}
  tolerations: []
  affinity: {}

csi:
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

csiController:
  nodeSelector: {}
  tolerations: []
  affinity: {}

csiNode:
  # Select every node on which application Pods may consume DISTORT volumes.
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  # Specifies whether component service accounts should be created.
  create: true
  # Annotations added to every component service account.
  annotations: {}
  # Optional component-specific names. Empty values use <release>-distort-<component>
  # when create is true. All four names are required and must be distinct when false.
  names:
    manager: ""
    agent: ""
    csiController: ""
    csiNode: ""

rbac:
  # Specifies whether RBAC resources should be created
  create: true

# Deprecated scheduling fallback retained for existing installations. A
# non-empty component-specific value above takes precedence.
nodeSelector: {}
tolerations: []
affinity: {}
