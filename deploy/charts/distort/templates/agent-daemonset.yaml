apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "distort.fullname" . }}-agent
  labels:
    {{- include "distort.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "distort.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "distort.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      hostNetwork: true
      hostIPC: true
      hostPID: true
      serviceAccountName: {{ include "distort.serviceAccountName" . }}
      initContainers:
        - name: load-modules
          image: busybox:1.36
          command: ["chroot", "/host", "sh", "-c", "modprobe nvmet nvmet-rdma nvme-fabrics nvme-core || true"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/distort-agent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: sys-class-nvme
              mountPath: /sys/class/nvme
              readOnly: true
            - name: sys-class-block
              mountPath: /sys/class/block
              readOnly: true
            - name: sys-kernel-config
              mountPath: /sys/kernel/config
              mountPropagation: Bidirectional
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: sys-class-nvme
          hostPath:
            path: /sys/class/nvme
            type: DirectoryOrCreate
        - name: sys-class-block
          hostPath:
            path: /sys/class/block
            type: Directory
        - name: sys-kernel-config
          hostPath:
            path: /sys/kernel/config
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
