apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "distort.fullname" . }}-agent
  labels:
    {{- include "distort.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "distort.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "distort.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      hostNetwork: true
      hostIPC: true
      hostPID: true
      serviceAccountName: {{ include "distort.agentServiceAccountName" . }}
      initContainers:
        - name: load-modules
          image: busybox:1.36
          command: ["chroot", "/host", "sh", "-c", "modprobe vfio-pci uio_pci_generic nvme-tcp nvme-rdma nvme-fabrics nvme-core || true"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
      containers:
        - name: agent
          image: {{ include "distort.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/distort-agent
          {{- if ne (empty .Values.agent.spdk.iobufSmallPoolCount) (empty .Values.agent.spdk.iobufLargePoolCount) }}
          {{- fail "agent.spdk.iobufSmallPoolCount and agent.spdk.iobufLargePoolCount must be configured together" }}
          {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if not (empty .Values.agent.spdk.iobufSmallPoolCount) }}
            - name: SPDK_IOBUF_SMALL_POOL_COUNT
              value: {{ .Values.agent.spdk.iobufSmallPoolCount | quote }}
            {{- end }}
            {{- if not (empty .Values.agent.spdk.iobufLargePoolCount) }}
            - name: SPDK_IOBUF_LARGE_POOL_COUNT
              value: {{ .Values.agent.spdk.iobufLargePoolCount | quote }}
            {{- end }}
            {{- if not (empty .Values.agent.spdk.maxSrqDepth) }}
            - name: SPDK_NVMF_MAX_SRQ_DEPTH
              value: {{ .Values.agent.spdk.maxSrqDepth | quote }}
            {{- end }}
            {{- if .Values.agent.spdk.skipHugepageSetup }}
            # SPDK setup.sh inherits this documented switch from the agent.
            - name: SKIP_HUGE
              value: "yes"
            {{- end }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: hugepages
              mountPath: /dev/hugepages
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: sys
              mountPath: /sys
              mountPropagation: HostToContainer
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: hugepages
          emptyDir:
            medium: HugePages
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
