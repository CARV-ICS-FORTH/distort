{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "distort.serviceAccountName" . }}
  labels:
    {{- include "distort.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "distort.fullname" . }}-role
  labels:
    {{- include "distort.labels" . | nindent 4 }}
rules:
- apiGroups:
  - storage.distort.io
  resources:
  - nvmedevices
  - nvmedeviceclaims
  - nvmepartitions
  - nvmevolumeattachments
  - rdmastoragenodes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - storage.distort.io
  resources:
  - nvmedevices/status
  - nvmedeviceclaims/status
  - nvmepartitions/status
  - nvmevolumeattachments/status
  - rdmastoragenodes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  - nodes
  - events
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  - volumeattachments
  - volumeattachments/status
  - csinodes
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "distort.fullname" . }}-rolebinding
  labels:
    {{- include "distort.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "distort.fullname" . }}-role
subjects:
- kind: ServiceAccount
  name: {{ include "distort.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end -}}
