{{- $serviceAccounts := list (include "distort.managerServiceAccountName" .) (include "distort.agentServiceAccountName" .) (include "distort.csiControllerServiceAccountName" .) (include "distort.csiNodeServiceAccountName" .) -}}
{{- if ne (len (uniq $serviceAccounts)) 4 -}}
{{- fail "manager, agent, CSI controller, and CSI node service account names must be distinct" -}}
{{- end }}
{{- if .Values.serviceAccount.create }}
{{- range $component := list "manager" "agent" "csiController" "csiNode" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "distort.componentServiceAccountName" (list $ $component) }}
  labels:
    {{- include "distort.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ kebabcase $component }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}

{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "distort.fullname" . }}-manager
  labels:
    {{- include "distort.labels" . | nindent 4 }}
rules:
- apiGroups: ["storage.distort.io"]
  resources: ["nvmedeviceclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["storage.distort.io"]
  resources: ["nvmedeviceclaims/status", "nvmedevices/status", "nvmepartitions/status", "rdmastoragenodes/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["storage.distort.io"]
  resources: ["nvmedeviceclaims/finalizers", "nvmepartitions/finalizers", "rdmastoragenodes/finalizers"]
  verbs: ["update"]
- apiGroups: ["storage.distort.io"]
  resources: ["nvmedevices"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["storage.distort.io"]
  resources: ["nvmepartitions"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["storage.distort.io"]
  resources: ["rdmastoragenodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "distort.fullname" . }}-manager
  labels:
    {{- include "distort.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "distort.fullname" . }}-manager
subjects:
- kind: ServiceAccount
  name: {{ include "distort.managerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "distort.fullname" . }}-agent
  labels:
    {{- include "distort.labels" . | nindent 4 }}
rules:
- apiGroups: ["storage.distort.io"]
  resources: ["nvmedeviceclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.distort.io"]
  resources: ["nvmedevices", "rdmastoragenodes"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["storage.distort.io"]
  resources: ["nvmedevices/status", "rdmastoragenodes/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["storage.distort.io"]
  resources: ["nvmepartitions"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["storage.distort.io"]
  resources: ["nvmepartitions/status", "nvmevolumeattachments/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["storage.distort.io"]
  resources: ["nvmepartitions/finalizers", "nvmevolumeattachments/finalizers"]
  verbs: ["update"]
- apiGroups: ["storage.distort.io"]
  resources: ["nvmevolumeattachments"]
  verbs: ["get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "distort.fullname" . }}-agent
  labels:
    {{- include "distort.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "distort.fullname" . }}-agent
subjects:
- kind: ServiceAccount
  name: {{ include "distort.agentServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "distort.fullname" . }}-csi-controller
  labels:
    {{- include "distort.labels" . | nindent 4 }}
rules:
- apiGroups: ["storage.distort.io"]
  resources: ["nvmepartitions", "nvmevolumeattachments"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "watch", "create", "delete", "patch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["volumeattachments"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["volumeattachments/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "distort.fullname" . }}-csi-controller
  labels:
    {{- include "distort.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "distort.fullname" . }}-csi-controller
subjects:
- kind: ServiceAccount
  name: {{ include "distort.csiControllerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
