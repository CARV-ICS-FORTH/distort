apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "distort.fullname" . }}-csi-node
  labels:
    {{- include "distort.labels" . | nindent 4 }}
    app.kubernetes.io/component: csi-node
spec:
  selector:
    matchLabels:
      {{- include "distort.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: csi-node
  template:
    metadata:
      labels:
        {{- include "distort.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: csi-node
    spec:
      hostNetwork: true
      # The node-driver-registrar and node CSI driver share this Pod identity.
      serviceAccountName: {{ include "distort.csiNodeServiceAccountName" . }}
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.9.1
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/storage.distort.io/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0
          args:
            - --csi-address=/csi/csi.sock
            # The node Pod uses host networking, so use a project-specific port.
            - --health-port=19808
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
        - name: csi-driver
          image: {{ include "distort.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/distort-csi
          args:
            - --endpoint=unix:///csi/csi.sock
            - --nodeid=$(NODE_ID)
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          ports:
            - name: healthz
              containerPort: 19808
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: plugin-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: "Bidirectional"
          resources:
            {{- toYaml .Values.csi.resources | nindent 12 }}
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/storage.distort.io/
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: DirectoryOrCreate
      {{- include "distort.scheduling" (list . .Values.csiNode) | nindent 6 }}
