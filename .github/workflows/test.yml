name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run unit, envtest, and contract tests
        run: |
          make test

      - name: Run race detector
        run: |
          make test-race

      - name: Compile Vagrant E2E suite
        run: |
          go test -tags=e2e ./test/e2e -run '^$'
